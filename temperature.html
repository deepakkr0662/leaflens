<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Graph</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <h1>Temperature Data</h1>
        <canvas id="temperatureChart"></canvas>
        <button onclick="goBack()">Back to Menu</button>
    </div>

    <script>
        // Sample temperature data for two devices
        const temperatureData = [
            { timestamp: "2025-01-12T16:36:34Z", device_id: "device1", temperature: 31.5 },
            { timestamp: "2025-01-12T16:36:34Z", device_id: "device2", temperature: 28.4 },
            { timestamp: "2025-01-12T17:36:34Z", device_id: "device1", temperature: 36.1 },
            { timestamp: "2025-01-12T17:36:34Z", device_id: "device2", temperature: 31.3 },
            { timestamp: "2025-01-12T18:36:34Z", device_id: "device1", temperature: 37.4 },
            { timestamp: "2025-01-12T18:36:34Z", device_id: "device2", temperature: 28.8 },
            { timestamp: "2025-01-12T19:36:34Z", device_id: "device1", temperature: 37.4 },
            { timestamp: "2025-01-12T19:36:34Z", device_id: "device2", temperature: 25.8 },
            { timestamp: "2025-01-12T20:36:34Z", device_id: "device1", temperature: 29.7 },
            { timestamp: "2025-01-12T20:36:34Z", device_id: "device2", temperature: 35.8 }
        ];

        // Group data by device
        const device1Data = temperatureData.filter(data => data.device_id === "device1");
        const device2Data = temperatureData.filter(data => data.device_id === "device2");

        // Extract data for chart
        const timestamps = device1Data.map(data => new Date(data.timestamp).toLocaleTimeString());
        const temperatureValuesDevice1 = device1Data.map(data => data.temperature);
        const temperatureValuesDevice2 = device2Data.map(data => data.temperature);

        // Create chart
        const ctx = document.getElementById('temperatureChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: timestamps,
                datasets: [
                    {
                        label: 'Device 1 Temperature (°C)',
                        data: temperatureValuesDevice1,
                        borderColor: 'rgba(75, 192, 192, 1)',
                        backgroundColor: 'rgba(75, 192, 192, 0.2)',
                        borderWidth: 2,
                        pointRadius: 4,
                        pointBackgroundColor: 'rgba(75, 192, 192, 1)',
                    },
                    {
                        label: 'Device 2 Temperature (°C)',
                        data: temperatureValuesDevice2,
                        borderColor: 'rgba(255, 99, 132, 1)',
                        backgroundColor: 'rgba(255, 99, 132, 0.2)',
                        borderWidth: 2,
                        pointRadius: 4,
                        pointBackgroundColor: 'rgba(255, 99, 132, 1)',
                    }
                ]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: {
                        display: true,
                        position: 'top'
                    }
                },
                scales: {
                    x: {
                        title: {
                            display: true,
                            text: 'Timestamp'
                        }
                    },
                    y: {
                        title: {
                            display: true,
                            text: 'Temperature (°C)'
                        },
                        beginAtZero: false
                    }
                }
            }
        });

        // Back to menu function
        function goBack() {
            window.location.href = "menu.html";
        }
    </script>
</body>
</html>
